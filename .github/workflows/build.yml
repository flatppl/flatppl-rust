name: Build

# Builds release `flatppl` binaries for the supported platforms on every
# push and pull request to main, and updates the rolling `nightly`
# prerelease with the packaged binaries on pushes to main — the same
# pattern as flatppl-js's VSIX nightly.
#
# NOTE: correctness is covered by the separate `Test` workflow (test.yml).
# This job only needs the workspace to BUILD in release mode per target;
# --locked additionally catches a stale Cargo.lock.
#
# Pushes to main and manual runs build the shipped `flatppl` with
# profile-guided optimization (pgo/build.sh, pgo/README.md): each job trains
# on its own target and runner, then checks the PGO binary against a plain
# build of the same commit. The plain binary is uploaded as a separate
# artifact for hand timing. Pull requests build only the plain binary,
# because PGO triples the build time.
#
# Linux binaries are musl-linked (fully static) so one download runs on
# any distro regardless of glibc version; the workspace is pure Rust, so
# static linking costs nothing. Both macOS targets build on the arm64
# runner — cross-compiling x86_64 there only needs the rustup target.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual runs build a branch with PGO, as a push to main does.
  workflow_dispatch:

# Only one nightly update per ref. cancel-in-progress so a rapid run of
# pushes to main doesn't leave two jobs racing to push the shared
# `nightly` release tag (action-gh-release below) — the later commit
# wins, the earlier is cancelled.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      PGO: ${{ github.event_name != 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install musl linker
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: ${{ env.PGO == 'true' && 'llvm-tools' || '' }}

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build flatppl
        # --all-features so the shipped binary includes the optional verbs /
        # importers (hs3, pyhf); the default feature set omits them.
        if: env.PGO != 'true'
        run: cargo build --release --locked --all-features -p flatppl-cli --target ${{ matrix.target }}

      - name: Install Rosetta 2
        # The x86_64 training run executes on the arm64 runner.
        if: env.PGO == 'true' && matrix.target == 'x86_64-apple-darwin'
        run: sudo softwareupdate --install-rosetta --agree-to-license

      - name: Build flatppl with PGO
        # Builds with --all-features, as above.
        if: env.PGO == 'true'
        shell: bash
        run: pgo/build.sh ${{ matrix.target }}

      - name: Build flatppl-lsp
        run: cargo build --release --locked -p flatppl-lsp --target ${{ matrix.target }}

      - name: Package binary with README and LICENSE
        shell: bash
        run: |
          t=${{ matrix.target }}
          exe=
          [[ $t == *windows* ]] && exe=.exe
          shipped=target/$t/release
          mkdir -p dist/stage dist/lsp
          if [[ $PGO == true ]]; then
            shipped=target-pgo/use/$t/release
            mkdir -p dist/plain
            cp "target/$t/release/flatppl$exe" dist/plain/
          fi
          cp README.md LICENSE "$shipped/flatppl$exe" dist/stage/
          cp "target/$t/release/flatppl-lsp$exe" "dist/lsp/flatppl-lsp-$t$exe"
          case $t in
            *windows*) (cd dist/stage && 7z a "../flatppl-nightly-$t.zip" .) ;;
            *) tar -czf "dist/flatppl-nightly-$t.tar.gz" -C dist/stage . ;;
          esac

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: flatppl-nightly-${{ matrix.target }}
          path: |
            dist/flatppl-nightly-*.tar.gz
            dist/flatppl-nightly-*.zip
            dist/lsp/flatppl-lsp-*

      - name: Upload plain binary artifact
        if: env.PGO == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: flatppl-plain-${{ matrix.target }}
          path: dist/plain/

  release:
    name: Update nightly release
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Collect binary artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: flatppl-nightly-*
          merge-multiple: true

      - name: Update nightly release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: nightly
          name: Nightly Build
          prerelease: true
          files: |
            dist/*
            dist/lsp/*
          body: |
            Nightly build of the `flatppl` CLI.
            Built from commit ${{ github.sha }}.

            Pick the archive for your platform (Linux binaries are fully
            static musl builds), e.g.:
            ```
            curl -L https://github.com/${{ github.repository }}/releases/download/nightly/flatppl-nightly-x86_64-unknown-linux-musl.tar.gz | tar -xz
            ./flatppl --help
            ```

            Alternatively, build from source:
            ```
            cargo install --git https://github.com/${{ github.repository }} flatppl-cli --all-features
            ```

            The language server is published as a raw per-platform binary,
            e.g. `flatppl-lsp-x86_64-unknown-linux-musl` (no archive).
