[package]
name = "flatppl-host"
description = "Immutable source contexts and typed StableHLO query exports for native FlatPPL hosts."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
flatppl-bundle = { path = "../bundle", features = ["source"] }
flatppl-core = { path = "../core" }
flatppl-syntax = { path = "../syntax" }
flatppl-infer = { path = "../infer" }
flatppl-determinizer = { path = "../determinizer" }
flatppl-stablehlo = { path = "../stablehlo" }
flatppl-fileaccess = { path = "../fileaccess" }
flatppl-hs3 = { path = "../hs3" }
flatppl-formula = { path = "../formula", features = ["arrow"] }
flatppl-mathdoc = { path = "../mathdoc", default-features = false }
serde.workspace = true
serde_json.workspace = true
csv = "1.4.0"
half = "2.7.1"
sha2.workspace = true
