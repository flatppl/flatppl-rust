[package]
name = "flatppl-formula"
description = "A brms-compatible Gaussian formula frontend for FlatPPL."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
arrow = ["dep:arrow-array", "dep:arrow-ipc", "dep:arrow-schema"]

[dependencies]
flatppl-core = { path = "../core" }
flatppl-convert = { path = "../convert" }
flatppl-syntax = { path = "../syntax" }
serde.workspace = true
serde_json.workspace = true
arrow-array = { version = "60.0.0", optional = true }
arrow-ipc = { version = "60.0.0", optional = true }
arrow-schema = { version = "60.0.0", optional = true }
