[package]
name = "flatppl-formula"
description = "A brms-compatible formula frontend for FlatPPL."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
arrow = ["flatppl-data/arrow"]

[dependencies]
flatppl-core = { path = "../core" }
flatppl-data = { path = "../data" }
flatppl-convert = { path = "../convert" }
flatppl-syntax = { path = "../syntax" }
flatppl-infer = { path = "../infer" }
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
nalgebra = { version = "0.35.0", default-features = false, features = ["std"] }

[dev-dependencies]
arrow-array = "60.0.0"
arrow-ipc = "60.0.0"
arrow-schema = "60.0.0"
