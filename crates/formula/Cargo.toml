[package]
name = "flatppl-formula"
description = "A brms-compatible formula frontend for FlatPPL."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
arrow = ["dep:arrow-array", "dep:arrow-ipc", "dep:arrow-schema"]

[dependencies]
flatppl-core = { path = "../core" }
flatppl-convert = { path = "../convert" }
flatppl-syntax = { path = "../syntax" }
flatppl-infer = { path = "../infer" }
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
csv = "1.4.0"
nalgebra = { version = "0.35.0", default-features = false, features = ["std"] }
arrow-array = { version = "60.0.0", optional = true }
arrow-ipc = { version = "60.0.0", optional = true }
arrow-schema = { version = "60.0.0", optional = true }
